# Builds the agent's container for Phala (linux/amd64) and pushes it to
# GitHub's registry; deploy it by the digest this prints.
name: agent image

on:
  push:
    branches: [main]
    paths: ['enclave/Dockerfile', 'enclave/server.mjs', 'lib/**', 'skill/**', 'package.json', 'package-lock.json', '.dockerignore']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: enclave/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ask-ens-agent:latest
            ghcr.io/${{ github.repository_owner }}/ask-ens-agent:${{ github.sha }}
      - run: echo "Deploy ghcr.io/${{ github.repository_owner }}/ask-ens-agent@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
