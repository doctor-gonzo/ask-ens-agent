# Phala Cloud (dstack) app: the agent in a TEE. Values in ${...} are Phala's
# encrypted environment variables. Pin the image by digest so the attested
# app is exactly the published build; the plain values below are part of
# the attested compose file on purpose.
services:
  agent:
    image: ghcr.io/doctor-gonzo/ask-ens-agent@sha256:25cfc2992f6fc3d0b17b3b9c469c1e84a49d097f178e20019af46ec1bb37cf78
    restart: always
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      CONFIDENTIAL_AI_KEY: ${CONFIDENTIAL_AI_KEY}
      FACTS_TOKEN: ${FACTS_TOKEN}
      RECLAIM_APP_ID: ${RECLAIM_APP_ID}
      RECLAIM_APP_SECRET: ${RECLAIM_APP_SECRET}
      REQUIRE_TEE: "1"
      FACTS_REPO: "doctor-gonzo/ask-ens-agent-data"
      FACTS_PATH: "facts.yaml"
      # Reclaim's AI-built Frontiers provider: proofs run in Reclaim's web portal
      # (nothing to install). It has no request hashes, so the agent checks the
      # signed claim's content itself (lib/reclaim.mjs aiAttendee).
      RECLAIM_PROVIDER_ID: "91e61e57-38f3-4127-8504-beae06d496be"
      RECLAIM_PROVIDER_VERSION: "1.0.0"
      RECLAIM_AI_PROVIDER: "1"
      # zkPass, used only while Reclaim isn't configured. Both ids are public, and
      # the schema id here is the only proof it accepts (docs/zkpass-schema.json).
      ZKPASS_APP_ID: "69068e60-08b4-42be-a15d-5f2a9220c682"
      ZKPASS_SCHEMA_ID: "8249f91782964a7fa460c467577edcf8"
    ports:
      - "8790:8790"
    volumes:
      # The dstack guest agent: keys are derived through it, and its presence
      # is how the service knows it runs in a TEE.
      - /var/run/dstack.sock:/var/run/dstack.sock
      - agent-data:/data
volumes:
  agent-data:
