# Fictional sample facts for development. The real file lives in a private
# repo. Each fact names the lowest tier allowed to hear it:
#   public    anyone who pays a dime
#   attendee  someone who proved they're registered for Paradigm Frontiers 2026
# An optional `question` is shown on the page as something that tier can ask.
facts:
  - id: home-city
    tier: public
    question: Where are you?
    text: Charlie is in San Francisco.
  - id: favorite-book
    tier: public
    question: What's your favorite book?
    text: Charlie's favorite book is The Dispossessed by Ursula K. Le Guin.
  - id: building
    tier: public
    text: Charlie builds tools for privacy, coordination and better ways to work with AI.
  - id: at-frontiers
    tier: attendee
    question: Where are you?
    text: Charlie is at Paradigm Frontiers this week, at Gallery 308, Fort Mason.
  - id: coffee
    tier: attendee
    question: What's your coffee order?
    text: Charlie's go-to coffee order is a cortado.
location:
  public: San Francisco
  attendee: Gallery 308, Fort Mason
