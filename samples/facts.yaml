# Sample facts for development, shaped like the real ones; the real file
# lives in a private repo. Each fact names the lowest tier allowed to hear it:
#   public    anyone who pays a dime
#   attendee  someone who proved they're registered for Paradigm Frontiers 2026
# An optional `question` is shown on the page as something that tier can ask
# (questions above a visitor's tier stay hidden until they're admitted).
facts:
  - id: home-city
    tier: public
    question: Where are you?
    text: Charlie is in San Francisco.
  - id: books-read
    tier: public
    question: What books have you read in the last two years?
    text: In the last two years Charlie has read a sample list of books.
  - id: building
    tier: public
    text: Charlie builds tools for privacy, coordination and better ways to work with AI.
  - id: at-frontiers
    tier: attendee
    question: Where are you?
    text: Charlie is at a sample venue this week.
  - id: most-alpha
    tier: attendee
    question: What book do you think has the most alpha?
    text: Charlie thinks the sample book with the most alpha is a sample title.
location:
  public: San Francisco
  attendee: A sample venue
